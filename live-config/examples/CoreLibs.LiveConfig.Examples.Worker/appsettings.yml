liveconfig:
  criticalConfigTypes:
    - bonuses
    - game-settings
    - Currencies
    - Items
    - ItemPrices
    - ItemBundles
    - TournamentRewards
    - Tournaments
  pollingInterval: "00:05:00"
  enablePollingFallback: false
  enablePreload: true
  preloadSourceName: gsheet
  forceSourceRefresh: true
  retry:
    maxRetries: 3
    initialDelay: "00:00:00.250"
    maxDelay: "00:00:05"

  store:
    mongodb:
      collectionName: config_snapshots

  retention:
    enabled: true
    maxVersions: 30
    maxAge: "7.00:00:00"
    keepActiveAlways: true

  redis:
    keyPrefix: liveconfig
    notificationChannel: "liveconfig:updated"

  hosting:
    importQueueName: liveconfig-import
    rollbackQueueName: liveconfig-rollback
    enableMqConsumers: true
    enableRedisSubscriber: true
      
