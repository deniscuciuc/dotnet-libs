MongoDB:
  ConnectionString: "mongodb://localhost:27017/liveconfig_example"

Redis:
  ConnectionString: "localhost:6379"

RabbitMq:
  Host: "localhost"

Example:
  SourceMode: gsheet

Serilog:
  Using:
    - Serilog.Sinks.Console
    - Serilog.Expressions
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore.Hosting.Diagnostics: Warning
      Microsoft.AspNetCore.Routing.EndpointMiddleware: Warning
      Microsoft.AspNetCore.Server.Kestrel: Warning
      CoreLibs.LiveConfig.LiveConfigEngine: Debug
      CoreLibs.LiveConfig.CacheConfigApplier: Information
      CoreLibs.LiveConfig.GSheet: Information
      CoreLibs.LiveConfig.GSheet.GSheetConnector: Debug
      CoreLibs.LiveConfig.GSheet.GSheetParserService: Debug
      CoreLibs.LiveConfig.GSheet.Pipeline.LoggingPipelineObserver: Debug
      CoreLibs.LiveConfig.Hosting.Consumers.ConfigImportRequestConsumer: Information
  RequestLogging:
    DefaultLevel: Information
    PathLevels:
      - Path: /health
        Level: Debug
      - Path: /swagger
        Level: Debug
      - Path: /openapi
        Level: Debug
      - Path: /favicon.ico
        Level: Debug
  WriteTo:
    - Name: Console
