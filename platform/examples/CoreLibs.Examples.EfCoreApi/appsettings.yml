Postgres:
  connectionString: "Host=localhost;Port=5432;Database=corelibs_example;Username=postgres;Password=postgres"
  maxRetryCount: 3
  commandTimeout: 30

Sentry:
  enabled: false
  dsn: ""

Metrics:
  enabled: true
  endpointPath: "/metrics"

Cqrs:
  defaultBatchMaxSize: 100

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      Microsoft.EntityFrameworkCore: Information
  WriteTo:
    - Name: Console
