services:
  mongodb:
    image: mongo:8
    # Reddoxx.Quartz.MongoDbJobStore uses MongoDB transactions for distributed
    # locking, which requires a replica set. This single-node replica set is
    # sufficient for local development.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then checks for PRIMARY status.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})}catch(e){}; rs.hello().isWritablePrimary||quit(1)"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data:
