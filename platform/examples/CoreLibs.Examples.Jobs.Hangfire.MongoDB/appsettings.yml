Jobs:
  provider: hangfire
  store: mongodb
  maxRetries: 3
  defaultTimeoutSeconds: 60
  dashboard:
    enabled: true
    path: /hangfire
    authMode: allowLocal

MongoDB:
  connectionString: "mongodb://localhost:27017/corelibs-jobs"

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft: Warning
      Microsoft.Hosting.Lifetime: Information
      Hangfire: Warning
  WriteTo:
    - Name: Console
      Args:
        outputTemplate: "[{Timestamp:HH:mm:ss} {Level:u3}] {SourceContext} {Message:lj}{NewLine}{Exception}"
  Enrich:
    - FromLogContext
    - WithMachineName
    - WithEnvironmentName
