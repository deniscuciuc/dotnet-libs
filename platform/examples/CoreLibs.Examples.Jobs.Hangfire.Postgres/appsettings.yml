Jobs:
  provider: hangfire
  store: postgres
  maxRetries: 3
  defaultTimeoutSeconds: 60
  dashboard:
    enabled: true
    path: /hangfire
    authMode: allowLocal

Postgres:
  connectionString: "Host=localhost;Port=5432;Database=corelibs_jobs;Username=postgres;Password=postgres"

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft: Warning
      Microsoft.Hosting.Lifetime: Information
      Hangfire: Warning
  WriteTo:
    - Name: Console
      Args:
        outputTemplate: "[{Timestamp:HH:mm:ss} {Level:u3}] {SourceContext} {Message:lj}{NewLine}{Exception}"
  Enrich:
    - FromLogContext
    - WithMachineName
    - WithEnvironmentName
