name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to build, for example 0.1.0
        required: true
        type: string
      publish_nuget:
        description: Publish the package to NuGet.org
        required: true
        default: false
        type: boolean
      create_github_release:
        description: Create a GitHub Release and attach the package
        required: true
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack --no-build \
            --configuration Release \
            -p:PackageVersion=${{ inputs.version }} \
            -p:CopyrightYear=$(date +%Y) \
            --output ./nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ inputs.version }}
          path: ./nupkg/*.nupkg

      - name: Push to NuGet.org
        if: ${{ inputs.publish_nuget }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: ./nupkg/*.nupkg
          generate_release_notes: true